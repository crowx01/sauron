[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --strict-markers
    --tb=short
    -m "not live"
markers =
    integration: marks tests as integration tests that make real API calls with local-llama (free to run)
    live: hits external paid/quota-limited APIs or CLIs (e.g. real gemini/claude CLI); excluded by default, run explicitly with -m live